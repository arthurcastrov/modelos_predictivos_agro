name: Deploy Flutter Web to Firebase Hosting

on:
  workflow_dispatch:  # Solo se ejecuta manualmente

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📑 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🛠️ Compilar Flutter Web
        run: flutter build web --release

      - name: 📦 Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: 🚀 Desplegar en Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"